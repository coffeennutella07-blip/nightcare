'<section class="card"><h2>Weekly check-in</h2><p class="sub">Once a week is plenty. Rate how things feel, and add a photo if you like.</p><label class="note" for="cd">Dryness: <b id="cdv">5</b>/10 (10 = very dry)</label><input id="cd" type="range" min="1" max="10" value="5"><label class="note" for="cc">Comfort: <b id="ccv">5</b>/10 (10 = very comfortable)</label><input id="cc" type="range" min="1" max="10" value="5"><label class="note" for="cp">Photo (optional)</label><input id="cp" type="file" accept="image/*"><button class="btn" data-a="chk" style="margin-top:10px">Save check-in</button>'+
(ck.length>1?'<p style="margin-top:10px"><b>Dryness '+f.d+'/10 → '+l.d+'/10 · Comfort '+f.c+'/10 → '+l.c+'/10</b></p>':'')+(ck.length?'<div class="ph">'+ck.map(function(x,i){return'<div>'+(x.p?'<img src="'+x.p+'" alt="Week '+(i+1)+' photo">':'')+'Week '+(i+1)+'<br>D '+x.d+' · C '+x.c+'</div>'}).join('')+'</div>':'')+'<p class="note">These are your own ratings, not a skin diagnosis.</p></section>'}

function render(){clearInterval(tmr);bt.forEach(clearTimeout);bt=[];stopPad();nav();var h=!S?onboard():R?runner():tab==='tonight'?tonight():tab==='goals'?goals():tab==='progress'?progress():plan();$('app').innerHTML=h;window.scrollTo(0,0);

document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,v=b.dataset.v;

if(a==='breathe'){pad(120);breatheCues();clock(120,function(){bt.forEach(clearTimeout);bt=[];chime();say('a','Lovely. Take one more slow breath, then tap Done.')});return}
if(a==='send'){var i=$('ci'),t=i.value.trim();if(!t)return;i.value='';say('u',t);setTimeout(function(){if(R)say('a',reply(t))},600);return}

else if(a==='rg'){if(S.goals.length<2){alert('Keep at least one goal.');return}S.goals=S.goals.filter(function(g){return g!==v})}
else if(a==='chk'){var ent={d:+$('cd').value,c:+$('cc').value,p:'',t:key(new Date())},f=$('cp').files[0];if(f){readImg(f,function(u){ent.p=u;S.checks.push(ent);save();render()});return}S.checks.push(ent)}
else if(a==='sset'){S.name=$('sn').value.trim()||S.name;S.persona=$('sp').value;S.time=$('st').value||S.time}

save();render()});
